# Dependabot version updates (the 2026-09-28 security review's S2, version-update half).
#
# Three ecosystems, one per lockfile the repository commits:
#   - uv             the root workspace (`pyproject.toml` + `uv.lock`, CLAUDE.md §2)
#   - npm            `/frontend` (`pnpm-lock.yaml`; Dependabot's npm ecosystem reads pnpm lockfiles)
#   - github-actions every `uses:` in `.github/workflows/` (each pinned to a 40-hex SHA)
#
# Weekly, one grouped PR per ecosystem, at most three open at a time, so a bump arrives
# as a reviewable batch rather than a stream.
#
# Each group takes only `minor` and `patch` updates (`update-types`, GitHub's documented
# `groups` key). A MAJOR bump is left out of the group and arrives as its own PR, so a
# breaking toolchain jump is reviewed on its own rather than bundled. Dependabot's first
# grouped PR (#850) bundled four major action jumps together, which prompted this.
#
# Commit messages: prefix `chore` with `include: "scope"`, which Dependabot renders as
# `chore(deps): …` or `chore(deps-dev): …`, a Conventional Commits title (CLAUDE.md §10).
# A prefix of `chore(deps)` with the scope included would render `chore(deps)(deps): …`,
# which is not one. `history-policy.yml` checks commit messages, not files; a Dependabot
# message carries no session link, so it passes that check (proved on the PR that added
# this file). Bot PRs carry no `SL-`: `document-ids.md` exempts bot authors.
#
# Settings are not configured here: automated security fixes, code scanning and secret
# scanning are repository settings and the maintainer's.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    # RS-1176 F4 condition 1: hypothesis is an exact pin (==6.165.7); a newer version is unmeasured for seed/shrink determinism. Move it only as a governed change (spike + ruling).
    ignore:
      - dependency-name: "hypothesis"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
