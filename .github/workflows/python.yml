name: python

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'backend/**'
      - 'pipelines/**'        # arrives in W7, not W4 (CLAUDE.md §2)
      - 'pyproject.toml'
      - 'uv.lock'
      - '.importlinter'
      # scripts/** rather than named files: `ruff check .` and mypy cover this directory,
      # so a new script that does not match the filter is linted by nothing. Adding
      # scope-audit.py triggered only the docs workflow, which is how this was noticed.
      - 'scripts/**'
      # `examples/**` for the same reason as `scripts/**`: the seed, its loader and its
      # test are Python that ruff, mypy and pytest all cover, so a change touching only
      # this directory was checked by nothing. Noticed when W6a's closure edited the seed
      # and the python workflow did not run.
      - 'examples/**'
      - 'docs/contracts/**'
      # docs/** because every one of tests/'s root test files reads content under
      # docs/ — the working notes, the register, the roadmap or the spec suite — so a
      # change confined to docs/ is exactly the change this suite exists to check, not
      # an unrelated directory. Noticed 2026-09-01: PR #555 filed a new working note,
      # growing docs/notes/ from 18 to 19 files and breaking two tests that assert on
      # that count and on the note's own content (test_audit_docs_notes_tombstone.py,
      # test_notes_move_citations.py) — on `main`, with CI green throughout, because
      # docs.yml (which did trigger) runs only `audit-docs.py`, never `pytest`.
      - 'docs/**'
      # tests/** for the third time this has bitten: the repository-invariant suite
      # lives here and `uv run pytest -q` runs it, so a change touching only this
      # directory was checked by nothing. Noticed when FR-PLAT-57's single-head guard
      # triggered only the docs workflow — a check that cannot run is not enforcement.
      - 'tests/**'
      # .claude/skills/reporter-cycle/** for the fifth time this has bitten (the
      # fourth is pyproject.toml's own testpaths comment, which registered this same
      # directory's tests as collectable but not as triggered): reporter.py's tests
      # are stdlib-only and outside the uv workspace, but `uv run pytest -q` still
      # collects and runs them via testpaths, so a PR touching only this directory
      # was checked by nothing here — a check that cannot run is not enforcement.
      # Scoped to this one skill's scripts, not all of .claude/**, so an unrelated
      # skill edit does not drag every skill through the Python gate.
      - '.claude/skills/reporter-cycle/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'backend/**'
      - 'pipelines/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.importlinter'
      # scripts/** rather than named files: `ruff check .` and mypy cover this directory,
      # so a new script that does not match the filter is linted by nothing. Adding
      # scope-audit.py triggered only the docs workflow, which is how this was noticed.
      - 'scripts/**'
      - 'examples/**'
      - 'docs/contracts/**'
      # docs/** because every one of tests/'s root test files reads content under
      # docs/ — the working notes, the register, the roadmap or the spec suite — so a
      # change confined to docs/ is exactly the change this suite exists to check, not
      # an unrelated directory. Noticed 2026-09-01: PR #555 filed a new working note,
      # growing docs/notes/ from 18 to 19 files and breaking two tests that assert on
      # that count and on the note's own content (test_audit_docs_notes_tombstone.py,
      # test_notes_move_citations.py) — on `main`, with CI green throughout, because
      # docs.yml (which did trigger) runs only `audit-docs.py`, never `pytest`.
      - 'docs/**'
      # tests/** for the third time this has bitten: the repository-invariant suite
      # lives here and `uv run pytest -q` runs it, so a change touching only this
      # directory was checked by nothing. Noticed when FR-PLAT-57's single-head guard
      # triggered only the docs workflow — a check that cannot run is not enforcement.
      - 'tests/**'
      # .claude/skills/reporter-cycle/** for the fifth time this has bitten (the
      # fourth is pyproject.toml's own testpaths comment, which registered this same
      # directory's tests as collectable but not as triggered): reporter.py's tests
      # are stdlib-only and outside the uv workspace, but `uv run pytest -q` still
      # collects and runs them via testpaths, so a PR touching only this directory
      # was checked by nothing here — a check that cannot run is not enforcement.
      # Scoped to this one skill's scripts, not all of .claude/**, so an unrelated
      # skill edit does not drag every skill through the Python gate.
      - '.claude/skills/reporter-cycle/**'
      - '.github/workflows/python.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ruff · mypy · import-linter · pytest
    runs-on: ubuntu-latest
    # The audit and outbox invariants are PostgreSQL behaviours — advisory locks, partial
    # unique indexes, FOR UPDATE SKIP LOCKED, privilege grants, triggers. Without a real
    # database those tests skip, and a skipped test for an invariant that cannot be
    # retrofitted is indistinguishable from no test at all.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gipricing
          POSTGRES_PASSWORD: gipricing
          POSTGRES_DB: gipricing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gipricing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The outbox's guarantee is about the seam between a transaction and a broker, so
      # the broker in that test is a real one.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # LightGBM's Linux wheel links against the OpenMP runtime and does **not** vendor
      # it: `import lightgbm` fails with `OSError: libgomp.so.1: cannot open shared object
      # file` on an image without it. XGBoost's wheel does vendor one, so a suite
      # exercising only the primary backend passes on a machine where the secondary cannot
      # even import — which is exactly how this was found, locally, in W5.
      #
      # A no-op on the GitHub runner images, which ship libgomp1 with gcc. Kept because
      # "the runner happens to have it" is not a dependency declaration, and the failure it
      # prevents is a collection error with no obvious connection to the change.
      - name: OpenMP runtime (LightGBM)
        run: |
          dpkg -s libgomp1 >/dev/null 2>&1 \
            || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1)

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: {enable-cache: true}
      - run: uv sync --all-packages --dev

      # =====================================================================
      # STAGES — every one runs, whatever the ones before it did.
      #
      # Until 2026-09-06 these were ordinary steps, so the job stopped at the
      # first red one and reported exactly one failure per run. That morning it
      # stopped at Ruff and hid 174 pytest failures and 3 drifted contracts for
      # an hour: nobody knew they existed, because the workflow never reached
      # them. A gate that surfaces one failure per cycle costs one full CI cycle
      # per failure, and it also makes "is this the only thing wrong?"
      # unanswerable — which is the worse of the two.
      #
      # `continue-on-error: true` leaves the step's `conclusion` as `success`
      # while its `outcome` keeps the real result. **The summary therefore
      # aggregates `outcome`, never `conclusion`** — aggregating `conclusion`
      # would produce a job that is green no matter what failed, which is the
      # obvious wrong form of this change.
      #
      # The setup steps above (checkout, libgomp, setup-uv, `uv sync`) are
      # deliberately NOT stages. Nothing below can run without them, so failing
      # fast there is the honest answer rather than eight identical
      # "uv: command not found" errors. The line between the two groups is
      # "would this failure make every later stage's result meaningless?".
      #
      # Same runners, same `fetch-depth: 0`, same commands as before. Only the
      # early exit is gone.
      # =====================================================================

      - name: Ruff
        id: ruff
        continue-on-error: true
        run: |
          echo "BROKEN-INPUT PROOF: this stage is deliberately failing."
          uv run ruff check .
          exit 1

      - name: mypy --strict
        id: mypy
        continue-on-error: true
        run: uv run mypy

      # ADR-0001 is only worth having if it is checked. A forbidden import in
      # pricing-core fails the build here rather than being noticed in review.
      - name: Architecture contracts (ADR-0001 / ADR-0002 / DEP-3)
        id: importlinter
        continue-on-error: true
        run: uv run lint-imports

      # Deduplication is a primary-key behaviour and presigning is a signature behaviour.
      # Neither is testable against a double, so CI runs a real S3-compatible store.
      #
      # A `services:` entry cannot express this: minio/minio needs the `server /data`
      # command, and service containers take no command. (bitnami/minio, which starts a
      # server by default, no longer publishes a `latest` tag.) So it starts as a step.
      #
      # A stage rather than a setup step: it gates only `Tests`, and a MinIO that
      # will not start must not also cost the run its ruff, mypy and contract
      # results.
      - name: Start MinIO
        id: minio
        continue-on-error: true
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=gipricing -e MINIO_ROOT_PASSWORD=gipricing \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live

      # FR-PLAT-35: migrations are an explicit step, never run on application start.
      - name: Migrate
        id: migrate
        continue-on-error: true
        run: uv run alembic upgrade head
        env:
          GIP_DATABASE_URL: postgresql+asyncpg://gipricing:gipricing@localhost:5432/gipricing

      - name: Tests
        id: pytest
        continue-on-error: true
        run: uv run pytest -q
        env:
          GIP_DATABASE_URL: postgresql+asyncpg://gipricing:gipricing@localhost:5432/gipricing
          GIP_TEST_DATABASE_URL: postgresql+asyncpg://gipricing:gipricing@localhost:5432/gipricing
          GIP_BLOB_ENDPOINT_URL: http://localhost:9000
          GIP_REDIS_URL: redis://localhost:6379/0

      # FR-PLAT-48 / ADR-0002: the models are the source of truth, so the committed
      # contract follows the code. A drift fails the build rather than being noticed when
      # a generated frontend client stops matching the API.
      - name: Generated contracts are current
        id: contracts
        continue-on-error: true
        run: |
          echo "BROKEN-INPUT PROOF: this stage is deliberately failing."
          exit 1

      # skills-map §9.1: requirement coverage is reported, so drift between the
      # specification and what is actually tested is visible rather than assumed.
      - name: Requirement coverage
        id: reqcoverage
        continue-on-error: true
        run: uv run python scripts/req-coverage.py

      # =====================================================================
      # THE VERDICT. This step, and only this step, decides whether the job is
      # red. `if: always()` so a cancelled-adjacent state still reports.
      #
      # The stage list below is written out by hand and must be kept in step
      # with the `id:`s above. There is no way to enumerate a job's steps from
      # inside it, so the alternative to this list is no table at all. A stage
      # added above and forgotten here is invisible to the verdict — the
      # broken-input proof for this workflow (see the PR that introduced it)
      # deliberately fails two NON-ADJACENT stages precisely to show the table
      # names both rather than stopping at the first.
      # =====================================================================
      - name: Gate summary
        if: always()
        env:
          S_ruff: ${{ steps.ruff.outcome }}
          S_mypy: ${{ steps.mypy.outcome }}
          S_import_linter: ${{ steps.importlinter.outcome }}
          S_minio: ${{ steps.minio.outcome }}
          S_migrate: ${{ steps.migrate.outcome }}
          S_pytest: ${{ steps.pytest.outcome }}
          S_contracts: ${{ steps.contracts.outcome }}
          S_req_coverage: ${{ steps.reqcoverage.outcome }}
        run: |
          set -u
          stages="ruff mypy import_linter minio migrate pytest contracts req_coverage"
          failed=""
          nfail=0
          ntotal=0
          {
            echo "| stage | result | detail |"
            echo "|---|---|---|"
          } > summary.md
          for s in $stages; do
            ntotal=$((ntotal + 1))
            eval "outcome=\${S_${s}}"
            if [ "$outcome" = "success" ]; then
              printf '| %s | pass | %s |\n' "$s" "$outcome" >> summary.md
            else
              printf '| %s | FAIL | %s |\n' "$s" "$outcome" >> summary.md
              failed="$failed $s"
              nfail=$((nfail + 1))
            fi
          done
          if [ "$nfail" -eq 0 ]; then
            verdict="GATE: pass — $ntotal of $ntotal stages passed"
          else
            verdict="GATE: FAIL — $nfail of $ntotal stages failed:$failed"
          fi
          echo "" >> summary.md
          echo "$verdict" >> summary.md
          cat summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          [ "$nfail" -eq 0 ]
