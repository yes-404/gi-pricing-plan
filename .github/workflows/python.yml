name: python

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'backend/**'
      - 'pipelines/**'        # arrives in W7, not W4 (CLAUDE.md §2)
      - 'pyproject.toml'
      - 'uv.lock'
      - '.importlinter'
      # scripts/** rather than named files: `ruff check .` and mypy cover this directory,
      # so a new script that does not match the filter is linted by nothing. Adding
      # scope-audit.py triggered only the docs workflow, which is how this was noticed.
      - 'scripts/**'
      # `examples/**` for the same reason as `scripts/**`: the seed, its loader and its
      # test are Python that ruff, mypy and pytest all cover, so a change touching only
      # this directory was checked by nothing. Noticed when W6a's closure edited the seed
      # and the python workflow did not run.
      - 'examples/**'
      - 'docs/contracts/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'backend/**'
      - 'pipelines/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.importlinter'
      # scripts/** rather than named files: `ruff check .` and mypy cover this directory,
      # so a new script that does not match the filter is linted by nothing. Adding
      # scope-audit.py triggered only the docs workflow, which is how this was noticed.
      - 'scripts/**'
      - 'examples/**'
      - 'docs/contracts/**'
      - '.github/workflows/python.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ruff · mypy · import-linter · pytest
    runs-on: ubuntu-latest
    # The audit and outbox invariants are PostgreSQL behaviours — advisory locks, partial
    # unique indexes, FOR UPDATE SKIP LOCKED, privilege grants, triggers. Without a real
    # database those tests skip, and a skipped test for an invariant that cannot be
    # retrofitted is indistinguishable from no test at all.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gipricing
          POSTGRES_PASSWORD: gipricing
          POSTGRES_DB: gipricing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gipricing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The outbox's guarantee is about the seam between a transaction and a broker, so
      # the broker in that test is a real one.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv sync --all-packages --dev

      - name: Ruff
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy

      # ADR-0001 is only worth having if it is checked. A forbidden import in
      # pricing-core fails the build here rather than being noticed in review.
      - name: Architecture contracts (ADR-0001 / ADR-0002 / DEP-3)
        run: uv run lint-imports

      # Deduplication is a primary-key behaviour and presigning is a signature behaviour.
      # Neither is testable against a double, so CI runs a real S3-compatible store.
      #
      # A `services:` entry cannot express this: minio/minio needs the `server /data`
      # command, and service containers take no command. (bitnami/minio, which starts a
      # server by default, no longer publishes a `latest` tag.) So it starts as a step.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=gipricing -e MINIO_ROOT_PASSWORD=gipricing \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live

      # FR-PLAT-35: migrations are an explicit step, never run on application start.
      - name: Migrate
        run: uv run alembic upgrade head
        env:
          GIP_DATABASE_URL: postgresql+asyncpg://gipricing:gipricing@localhost:5432/gipricing

      - name: Tests
        run: uv run pytest -q
        env:
          GIP_DATABASE_URL: postgresql+asyncpg://gipricing:gipricing@localhost:5432/gipricing
          GIP_TEST_DATABASE_URL: postgresql+asyncpg://gipricing:gipricing@localhost:5432/gipricing
          GIP_BLOB_ENDPOINT_URL: http://localhost:9000
          GIP_REDIS_URL: redis://localhost:6379/0

      # FR-PLAT-48 / ADR-0002: the models are the source of truth, so the committed
      # contract follows the code. A drift fails the build rather than being noticed when
      # a generated frontend client stops matching the API.
      - name: Generated contracts are current
        run: uv run python scripts/generate-contracts.py --check

      # skills-map §9.1: requirement coverage is reported, so drift between the
      # specification and what is actually tested is visible rather than assumed.
      - name: Requirement coverage
        run: uv run python scripts/req-coverage.py
