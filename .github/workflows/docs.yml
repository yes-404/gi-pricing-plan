name: docs

# CLAUDE.md §2 requires CI to be path-filtered per component. GitHub applies `paths:` at
# the workflow level, not per job, so each component gets its own workflow. The alternative
# — one workflow with an action-based filter — adds a dependency to save a file.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/audit-docs.py', 'CLAUDE.md', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'scripts/audit-docs.py', 'CLAUDE.md', '.github/workflows/docs.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: specification audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # 14 checks: requirement IDs, cross-references, dependency direction, glossary
      # single-sourcing, money discipline, JSON Schema validity and $ref resolution.
      - run: python3 scripts/audit-docs.py
