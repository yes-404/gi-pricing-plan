name: docs

# CLAUDE.md §2 requires CI to be path-filtered per component. GitHub applies `paths:` at
# the workflow level, not per job, so each component gets its own workflow. The alternative
# — one workflow with an action-based filter — adds a dependency to save a file.
#
# `.claude/notes/**` is in the filter because checks 16-20 audit that directory. Adding the
# checks without adding the path would have been the worse half of a change: the audit would
# pass on every note-only commit by never running on one.
# The two path lists are duplicated rather than shared by a YAML anchor: GitHub Actions does
# not expand anchors in workflow files, and an alias here parses as a literal string that
# matches no path — the filter would silently match nothing.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.claude/notes/**', 'scripts/audit-docs.py', 'CLAUDE.md', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', '.claude/notes/**', 'scripts/audit-docs.py', 'CLAUDE.md', '.github/workflows/docs.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: specification audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # 20 checks: requirement IDs, cross-references, dependency direction, glossary
      # single-sourcing, money discipline, JSON Schema validity and $ref resolution over
      # docs/ (1-15), plus the working notes in .claude/notes/ (16-20).
      - run: python3 scripts/audit-docs.py
