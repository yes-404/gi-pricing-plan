name: docs

# CLAUDE.md §2 requires CI to be path-filtered per component. GitHub applies `paths:` at
# the workflow level, not per job, so each component gets its own workflow. The alternative
# — one workflow with an action-based filter — adds a dependency to save a file.
#
# The working notes live under docs/notes/ (moved out from under .claude, RFC-897 Slice 4),
# so `docs/**` below already covers the path checks 16-20 audit; no separate notes entry is
# needed the way one once was, back when the notes sat outside docs/ entirely.
# The two path lists are duplicated rather than shared by a YAML anchor: GitHub Actions does
# not expand anchors in workflow files, and an alias here parses as a literal string that
# matches no path — the filter would silently match nothing.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/audit-docs.py', 'scripts/doc-id.py', 'scripts/doc-index.py', 'scripts/_docid.py', 'scripts/_docverify.py', 'CLAUDE.md', '.claude/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'scripts/audit-docs.py', 'scripts/doc-id.py', 'scripts/doc-index.py', 'scripts/_docid.py', 'scripts/_docverify.py', 'CLAUDE.md', '.claude/**', '.github/workflows/docs.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: specification audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # `fetch-depth: 0` is what `doc-id.py migrate --verify` needs, for two reasons
        # now. RFC-937 §7(f)'s first reading materialises `8f5d57d`, a commit a shallow
        # clone does not have — and a shallow clone would not error, §7(f) would silently
        # lose one of its two readings. Since W37-6 PR-A there is a second, larger reason:
        # the snapshot is a `git clone` of this checkout carrying its **full history**,
        # because id allocation sorts on each module's git first-commit date (RFC-937
        # item 1) and that history is a declared input to the allocation, not context.
        # A shallow checkout here is refused by name rather than silently re-keying every
        # id (`doc-id.py`'s `GitHistoryUnavailableError`).
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      # See scripts/audit-docs.py's own module docstring for the numbered list this
      # summary would otherwise duplicate and go stale against (RFC-756) — it now runs
      # 1-29 plus RFC-937's id-standard checks 30-39 (docs/rfcs/RFC-00937-one-id-per-governed-thing-one-sequence-integer-identity-a-self-describing-layout-and-roles-per-family.md
      # §1.11), the latter path-scoped to `_ID_SCOPE_ROOTS` until the migration (W37-6)
      # widens it to the whole corpus.
      # =====================================================================
      # STAGES — every one runs, whatever the ones before it did. Same change,
      # and the same reason, as `python.yml`'s: on 2026-09-06 a run that died at
      # its first red step hid every later failure for an hour. `docs.yml` has
      # the identical shape — four independent checks in a row — so it had the
      # identical defect.
      #
      # The summary at the end aggregates each stage's `outcome` (the real
      # result), never its `conclusion` (which `continue-on-error` forces to
      # `success`). The checkout and setup-python steps above are not stages:
      # nothing below can run without them.
      # =====================================================================
      - name: audit-docs
        id: auditdocs
        continue-on-error: true
        run: python3 scripts/audit-docs.py
      # RFC-937 §1.7/§1.11: doc-id.py check fails on a duplicate id, a header/filename
      # mismatch, or a docs/INDEX.md contiguity gap; doc-index.py --check fails when a
      # fresh regeneration of docs/INDEX.md would differ from what is committed. Both are
      # no-ops before the migration (no ids exist yet to check or index).
      - name: doc-id check
        id: docidcheck
        continue-on-error: true
        run: python3 scripts/doc-id.py check
      - name: doc-index --check
        id: docindex
        continue-on-error: true
        run: python3 scripts/doc-index.py --check
      # RL-1043 §1 (docs/rulings/RL-01043-no-further-delegated-window-until-7-a-i-is-an-instrument.md): the
      # RFC-937 §7 acceptance standard is an instrument, not a hand-maintained table. It
      # "runs in CI on every PR touching `doc-id.py` or `audit-docs.py`, and is red on
      # `main` until green" — so this step is EXPECTED TO FAIL until the six failing rows
      # of RL-1043 §2 are fixed, in that ruling's order. **Do not weaken a predicate to
      # get a green** (RL-1043 §1: "A row that cannot be expressed as a predicate the
      # script computes is a row that was never enforceable").
      #
      # It is wired into this workflow rather than a new one because this workflow's
      # `paths:` filter is already a superset of the ruling's two files, and a fourth
      # component workflow would put CLAUDE.md §2's own description of CI out of date —
      # an amendment that is the maintainer's, not this step's (CLAUDE.md §12).
      #
      # The snapshot goes in RUNNER_TEMP, outside the checkout: the instrument refuses a
      # target inside any git work tree, which is the guard that keeps `migrate()` off a
      # real checkout. Exit 2 means "refused to run" (a misconfiguration); exit 1 means
      # "ran, and a row is red" — the standing state RL-1043 §1 keeps `main` in until
      # every row is green, not a fact this step exists to carry (RL-1045 §1, decision
      # 1). Exit 3 means the verdict set moved since the last recorded run — that is the
      # one this step fails on, because it is the only exit code that says something
      # about *this* change rather than about the standing backlog.
      # WHICH REF IS THE PRE-MIGRATION INPUT. `--ref HEAD` denotes the un-migrated control
      # only while the checkout itself is un-migrated. On a migrated checkout — the sentinel
      # is `audit-docs.py`'s `migrated_tree()`: docs/INDEX.md and docs/REDIRECTS.csv, the two
      # artifacts only the migration creates — HEAD already holds `migrate()`'s output, and
      # verifying `--ref HEAD` migrates a migrated tree: every recorded row reads 0 (phantom
      # PROGRESS) while the tool's own marked legacy-form literals read as residue. That is
      # what docs run 35261236904 did on #782's head 323b523: GitHub's PR merge ref 2ee3cdd
      # is the migrated tree, and the step exited 3 with (a)/(d1)/(d5)/(f) PASS -> FAIL and
      # (d4)/(d8)/(d9)/(d10) DISCLOSE -> FAIL — none of it about the change. The base the
      # migration ran from is recorded by the tool itself, in
      # docs/process/delivery-process.core.json `meta.verified_against_tree`, written from the
      # run ref (PL-00960: "the recorded merge-base SHA is load-bearing evidence, not a
      # courtesy"), so after the migration RL-1043 §1's standing verify keeps proving THIS
      # checkout's tool against that recorded base. The RL-1045 §1 exit-1 reading below is
      # unchanged. Deputy ruling of 2026-09-17 (W37-6 run 2, channel to-lead.md).
      - name: doc-id migrate --verify
        id: docidverify
        continue-on-error: true
        run: |
          ref=HEAD
          if [ -f docs/INDEX.md ] && [ -f docs/REDIRECTS.csv ]; then
            ref=$(python3 -c 'import json; print(json.load(open("docs/process/delivery-process.core.json"))["meta"]["verified_against_tree"])')
            echo "::notice::migrated checkout (docs/INDEX.md + docs/REDIRECTS.csv present): --ref ${ref} = core.json meta.verified_against_tree, the pre-migration base the tool recorded"
          else
            echo "::notice::un-migrated checkout: --ref HEAD is the pre-migration input"
          fi
          code=0
          python3 scripts/doc-id.py migrate --verify "${RUNNER_TEMP}/doc-id-verify" --ref "$ref" || code=$?
          if [ "$code" -eq 1 ]; then
            echo "::notice::--verify exited 1 (standing red, verdict set unchanged) — RL-1045 §1 reads this as a pass"
            exit 0
          fi
          exit "$code"

      # =====================================================================
      # THE VERDICT. This step, and only this step, decides whether the job is
      # red. The stage list is written out by hand and must be kept in step with
      # the `id:`s above — a job cannot enumerate its own steps, so the
      # alternative to this list is no table at all.
      #
      # Note what this step does NOT do: it does not re-interpret exit codes.
      # `doc-id migrate --verify`'s RL-1045 §1 normalisation (exit 1 is a
      # PASS — the standing red with the verdict set unchanged; exit 3 is the
      # failure) stays inside that stage's own `run:` block, where the reasoning
      # for it is written down. The summary only ever asks "did the stage
      # succeed?", so moving that logic here would have split one rule across
      # two places.
      # =====================================================================
      - name: Gate summary
        if: always()
        env:
          S_audit_docs: ${{ steps.auditdocs.outcome }}
          S_doc_id_check: ${{ steps.docidcheck.outcome }}
          S_doc_index: ${{ steps.docindex.outcome }}
          S_doc_id_verify: ${{ steps.docidverify.outcome }}
        run: |
          set -u
          stages="audit_docs doc_id_check doc_index doc_id_verify"
          failed=""
          nfail=0
          ntotal=0
          {
            echo "| stage | result | detail |"
            echo "|---|---|---|"
          } > summary.md
          for s in $stages; do
            ntotal=$((ntotal + 1))
            eval "outcome=\${S_${s}}"
            if [ "$outcome" = "success" ]; then
              printf '| %s | pass | %s |\n' "$s" "$outcome" >> summary.md
            else
              printf '| %s | FAIL | %s |\n' "$s" "$outcome" >> summary.md
              failed="$failed $s"
              nfail=$((nfail + 1))
            fi
          done
          if [ "$nfail" -eq 0 ]; then
            verdict="GATE: pass — $ntotal of $ntotal stages passed"
          else
            verdict="GATE: FAIL — $nfail of $ntotal stages failed:$failed"
          fi
          echo "" >> summary.md
          echo "$verdict" >> summary.md
          cat summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          [ "$nfail" -eq 0 ]
