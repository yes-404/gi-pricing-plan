name: frontend

# Path-filtered per component (`CLAUDE.md` §2). A docs-only change must not resolve a Node
# toolchain, and once both sides are moving neither should wait on the other's.
#
# **If branch protection is ever enabled, do not mark this a required check.** A required
# check that does not run on a given PR blocks it for ever; add an always-running
# aggregator job instead.
# Both triggers carry the same cross-component paths, as `python.yml` does. They diverged
# here until 2026-08-25: `docs/contracts/openapi/**` was on `pull_request` only. That was a
# consistency wart rather than a hole — the change was still checked, just not on `main` —
# but it left main's recorded frontend status stale for a contract-only change, and two
# cross-component paths treated differently for no stated reason is a thing the next reader
# re-derives. Fixed in the same commit that added the second one.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - "docs/contracts/openapi/**"
      - "packages/pricing-core/src/pricing_core/modelling/**"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      # The generated client is derived from the contract, so a contract change can break
      # the frontend without touching a file under frontend/.
      - "docs/contracts/openapi/**"
      # Same argument, one layer further out. `SUPPORTED_GBM_OBJECTIVES` in
      # `pricing_core/modelling/gbm.py` is the authoritative set of builtin GBM objectives
      # and reaches no contract — `model-schema` depends on pydantic alone and cannot
      # import it (OQ-MODEL-37). `builtinObjectives.test.ts` therefore reads that file as
      # text and fails when the two lists disagree, which makes a `pricing-core` edit able
      # to break a frontend test without touching a file under `frontend/`.
      #
      # `python.yml` has been bitten by the mirror image of this three times — `scripts/**`,
      # `examples/**` and `tests/**`, the last commented "for the third time this has
      # bitten … a check that cannot run is not enforcement". This is the first on the
      # frontend side, and the guard is worthless without it: `python.yml` carries no
      # `frontend/**`, so nothing would run when someone edits the TypeScript half.
      - "packages/pricing-core/src/pricing_core/modelling/**"

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # FR-OVR-6: the client is generated, never hand-written.
      #
      # There used to be a `git diff --exit-code -- src/api/generated` here, claiming to be
      # "the only thing that catches a contract change the frontend has not absorbed". It
      # could not fail: `src/api/generated/` is git-ignored (`.gitignore:38`), so the diff
      # is always empty — and in CI the directory does not even exist until this step
      # creates it, so there is nothing it could be compared against.
      #
      # **`type-check` against the freshly generated client is the real check**, and it is
      # a stronger one: a field the contract dropped or renamed becomes a type error at
      # every site that reads it. That is why generation runs before it, and why the two
      # steps must stay in this order.
      - run: pnpm run generate:api

      # =====================================================================
      # STAGES — every one runs, whatever the ones before it did. Same change,
      # and the same reason, as `python.yml`'s and `docs.yml`'s: a job that
      # stops at its first red step reports one failure per CI cycle, and makes
      # "is this the only thing wrong?" unanswerable.
      #
      # `install` and `generate:api` above stay hard-fail setup steps rather
      # than stages: `lint`, `type-check`, `test` and `build` all read the
      # generated client, so a failure in either makes all four results
      # meaningless rather than merely absent. That is the line between the two
      # groups here — the same line `python.yml` draws at `uv sync`.
      #
      # The summary aggregates each stage's `outcome` (the real result), never
      # its `conclusion` (which `continue-on-error` forces to `success`).
      # =====================================================================
      - name: lint
        id: lint
        continue-on-error: true
        run: pnpm run lint
      - name: type-check
        id: typecheck
        continue-on-error: true
        run: pnpm run type-check
      - name: test
        id: test
        continue-on-error: true
        run: pnpm run test
      - name: build
        id: build
        continue-on-error: true
        run: pnpm run build

      # THE VERDICT. This step, and only this step, decides whether the job is
      # red. The stage list is written out by hand and must be kept in step with
      # the `id:`s above.
      #
      # `working-directory: frontend` is inherited from `defaults:` above, so
      # `summary.md` is written under `frontend/`. That is scratch in the
      # runner's checkout and never committed; it is also why this step does not
      # need its own `working-directory`.
      - name: Gate summary
        if: always()
        env:
          S_lint: ${{ steps.lint.outcome }}
          S_type_check: ${{ steps.typecheck.outcome }}
          S_test: ${{ steps.test.outcome }}
          S_build: ${{ steps.build.outcome }}
        run: |
          set -u
          stages="lint type_check test build"
          failed=""
          nfail=0
          ntotal=0
          {
            echo "| stage | result | detail |"
            echo "|---|---|---|"
          } > summary.md
          for s in $stages; do
            ntotal=$((ntotal + 1))
            eval "outcome=\${S_${s}}"
            if [ "$outcome" = "success" ]; then
              printf '| %s | pass | %s |\n' "$s" "$outcome" >> summary.md
            else
              printf '| %s | FAIL | %s |\n' "$s" "$outcome" >> summary.md
              failed="$failed $s"
              nfail=$((nfail + 1))
            fi
          done
          if [ "$nfail" -eq 0 ]; then
            verdict="GATE: pass — $ntotal of $ntotal stages passed"
          else
            verdict="GATE: FAIL — $nfail of $ntotal stages failed:$failed"
          fi
          echo "" >> summary.md
          echo "$verdict" >> summary.md
          cat summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          [ "$nfail" -eq 0 ]
