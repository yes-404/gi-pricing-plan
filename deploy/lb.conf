# The stated load-balancing topology for the Slice 4 path (PL-1537 R4.3): one nginx in front of
# n `api` replicas, round-robin over the replicas' addresses, which Docker's DNS returns for the
# service name. `valid=1s` re-resolves so a rolling replacement (NFR-531) is picked up.
resolver 127.0.0.11 valid=1s ipv6=off;

server {
    listen 8000;
    set $upstream http://api:8000;
    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503;
        # NFR-531: a connect to a just-removed replica's cached IP fails in 1 s, not 60 s, so the retry beats the client's 10 s (to-lead 2026-10-18 01:44:33 BST).
        proxy_connect_timeout 1s;
    }
}
