# Local full stack (NFR-OVR-9: no cloud dependency).
#
# Phase 1a brings up only what W2/W4 need. Services arrive as the workstreams that use
# them do — an unused container in the compose file is a claim the platform does not yet
# support, and it makes `docker compose up` slower for no benefit.

name: gi-pricing

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gipricing
      POSTGRES_PASSWORD: gipricing            # local only; production uses a secret ref
      POSTGRES_DB: gipricing
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gipricing"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Content-addressed blob store (ID-4). MinIO keeps NFR-OVR-9 honest — the same S3 API
  # locally as in production, so the storage path is never "works on my machine".
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: gipricing
      MINIO_ROOT_PASSWORD: gipricing
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The local identity provider (FR-PLAT-58), behind an opt-in profile.
  #
  # Not in the default `up`: this file's own rule is that an unused container is a claim the
  # platform does not support, and three of the four services are needed by every
  # contributor while this one is needed only by someone working on the browser login.
  # `--profile auth` is the difference between three containers and four.
  #
  # `start-dev` is deliberate. It runs HTTP-only against a dev-mode database, which is right
  # for a provider whose entire purpose is local, and refuses to be mistaken for the
  # production deployment FR-PLAT-59 says this project does not ship.
  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin      # local only, as with postgres above
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    # Port 9000 is Keycloak's management interface and is deliberately NOT published:
    # minio above already publishes 9000 to the host.
    volumes: ["./keycloak-local:/opt/keycloak/data/import:ro"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  pgdata:
  miniodata:
