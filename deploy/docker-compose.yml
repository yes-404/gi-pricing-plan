# Local full stack (NFR-462: no cloud dependency).
#
# Phase 1a brings up only what WK-658/WK-660 need. Services arrive as the workstreams that use
# them do — an unused container in the compose file is a claim the platform does not yet
# support, and it makes `docker compose up` slower for no benefit.

name: gi-pricing

# The deployment path (WK-674 Slice 4). `api`, the `worker-*` services and `migrate` are one image run under
# three commands (`deploy/Dockerfile`), behind the `app` profile: the default `up` stays the
# three backing services every contributor needs, and `--profile app` adds the path.
x-gip-env: &gip-env
  GIP_ENVIRONMENT: dev
  # FR-18: the full commit SHA the image was built from. `:-unset`, not `:?`, because compose
  # interpolates the whole file and the default `up` must still work; `unset` is refused by the
  # Dockerfile's SHA check at build and by `Settings.require_startable` at start.
  GIP_BUILD: ${GIP_BUILD:-unset}
  GIP_TENANT_ID: ${GIP_TENANT_ID:-compose-reference}
  GIP_DEV_AUTH_ENABLED: ${GIP_DEV_AUTH_ENABLED:-true}   # reference path only; FR-437 for production
  GIP_DATABASE_URL: postgresql+asyncpg://gipricing:gipricing@postgres:5432/gipricing
  GIP_REDIS_URL: redis://redis:6379/0
  GIP_BLOB_ENDPOINT_URL: http://minio:9000
  GIP_BLOB_ACCESS_KEY: gipricing
  GIP_BLOB_SECRET_KEY: gipricing

x-gip-build: &gip-build
  context: ..
  dockerfile: deploy/Dockerfile
  args:
    GIP_BUILD: ${GIP_BUILD:-unset}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gipricing
      POSTGRES_PASSWORD: gipricing            # local only; production uses a secret ref
      POSTGRES_DB: gipricing
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gipricing"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Content-addressed blob store (ID-4). MinIO keeps NFR-462 honest — the same S3 API
  # locally as in production, so the storage path is never "works on my machine".
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: gipricing
      MINIO_ROOT_PASSWORD: gipricing
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The local identity provider (FR-398), behind an opt-in profile.
  #
  # Not in the default `up`: this file's own rule is that an unused container is a claim the
  # platform does not support, and three of the four services are needed by every
  # contributor while this one is needed only by someone working on the browser login.
  # `--profile auth` is the difference between three containers and four.
  #
  # `start-dev` is deliberate. It runs HTTP-only against a dev-mode database, which is right
  # for a provider whose entire purpose is local, and refuses to be mistaken for the
  # production deployment FR-437 says this project does not ship.
  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin      # local only, as with postgres above
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    # Port 9000 is Keycloak's management interface and is deliberately NOT published:
    # minio above already publishes 9000 to the host.
    volumes: ["./keycloak-local:/opt/keycloak/data/import:ro"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  # FR-435: migrations are an explicit pre-deploy step, a one-shot container, never run by
  # `api` at start (`backend/migrations/env.py` says nothing here is invoked by `create_app`).
  # `api` waits for it to exit 0, so no replica starts against an unmigrated schema.
  migrate:
    profiles: ["app"]
    image: gi-pricing-app:${GIP_BUILD:-unset}
    build: *gip-build
    command: ["alembic", "upgrade", "head"]
    environment: *gip-env
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  # FR-434 / NFR-534: the scoring API deploys and scales on its own. It does not depend on
  # any `worker-*`, and `docker compose --profile app up api` starts it with no worker present.
  # Replicas: `docker compose --profile app up --scale api=<n>`; they sit behind `lb`.
  api:
    profiles: ["app"]
    image: gi-pricing-app:${GIP_BUILD:-unset}
    build: *gip-build
    # PL-1766 D5.13 (DP-S5-Q2 (a)): the uvicorn process count N per container is declared here,
    # not left to uvicorn's default. uvicorn reads `WEB_CONCURRENCY`, so the image's `CMD` is
    # unchanged. The default 1 is what ran before; a bench that raises it declares N, observes
    # it, and voids a reading whose observed N differs. The "replica" is the container; each
    # process under it is a separate subscriber.
    environment:
      <<: *gip-env
      WEB_CONCURRENCY: ${GIP_API_WEB_CONCURRENCY:-1}
    expose: ["8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    # FD-1211 (R4.2): the design is FINALIZE, then REPLACE. On stop the process gets SIGTERM,
    # uvicorn drains and the interpreter exits normally (`test_deploy_shutdown.py` proves a
    # process that has loaded FD-1199's extensions does so cleanly, N times); the container is
    # then replaced, never reused. The workers below do the same through Celery's warm shutdown.
    stop_grace_period: 20s

  # FR-415 / FR-405: one worker service per pool, all from the one image, so each pool is sized
  # independently (PL-1714 DP-Q1 (b), the maintainer's (by delegation) entry 2026-10-14 10:43:43).
  # A fit on `compute` then cannot starve a `score.batch` on `scoring`. Every `--queues` set is
  # one pool; `test_deploy_stack.py` derives the expected set from `DEFAULT_QUEUE_FOR_KIND`, so
  # a new pool without a service here goes red. The concurrency and `mem_limit` figures are
  # UNMEASURED starting values, env-overridable; measured sizing is S5's and the NFR session's.
  # `mem_limit` is the hard backstop; the per-Job `resource_budget.memory_gb` (FR-412) is checked
  # inside the process (`app.worker.progress`) and fails the Job naming the budget first.
  # `default` also carries the outbox relay's tasks (`RELAY_QUEUE`).
  worker-compute: &gip-worker
    profiles: ["app"]
    image: gi-pricing-app:${GIP_BUILD:-unset}
    build: *gip-build
    command: ["celery", "-A", "app.worker.entrypoint", "worker", "--queues", "compute", "--concurrency", "${GIP_WORKER_COMPUTE_CONCURRENCY:-2}"]
    environment: *gip-env
    mem_limit: ${GIP_WORKER_COMPUTE_MEM_LIMIT:-4g}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    stop_grace_period: 20s

  worker-scoring:
    <<: *gip-worker
    command: ["celery", "-A", "app.worker.entrypoint", "worker", "--queues", "scoring", "--concurrency", "${GIP_WORKER_SCORING_CONCURRENCY:-4}"]
    mem_limit: ${GIP_WORKER_SCORING_MEM_LIMIT:-2g}

  worker-io:
    <<: *gip-worker
    command: ["celery", "-A", "app.worker.entrypoint", "worker", "--queues", "io", "--concurrency", "${GIP_WORKER_IO_CONCURRENCY:-4}"]
    mem_limit: ${GIP_WORKER_IO_MEM_LIMIT:-2g}

  worker-default:
    <<: *gip-worker
    command: ["celery", "-A", "app.worker.entrypoint", "worker", "--queues", "default", "--concurrency", "${GIP_WORKER_DEFAULT_CONCURRENCY:-2}"]
    mem_limit: ${GIP_WORKER_DEFAULT_MEM_LIMIT:-2g}

  # The stated topology (PL-1537 R4.3): one nginx, round-robin over the `api` replicas.
  lb:
    profiles: ["app"]
    image: nginx:1.27-alpine
    volumes: ["./lb.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${GIP_LB_PORT:-8000}:8000"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  miniodata:
