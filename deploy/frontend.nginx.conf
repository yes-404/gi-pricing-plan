# The `frontend` service (FR-432): the built SPA at `/`, with a history fallback for its routes,
# and `/api/` proxied to `lb`, so the browser stays same-origin and nothing depends on CORS
# (`frontend/vite.config.ts` states the same design for the dev server). `lb` is resolved per
# request through Docker's DNS, as `deploy/lb.conf` does, so a restart of `lb` is picked up.
resolver 127.0.0.11 valid=1s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;

    # The API's body limit (`max_upload_body_mib`, 64 MiB) plus 1 MiB, as `deploy/lb.conf` has it:
    # nginx's own default of 1 MiB would answer an HTML 413 before the API's `PAYLOAD_TOO_LARGE`.
    client_max_body_size 65m;

    location /api/ {
        set $upstream http://lb:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
