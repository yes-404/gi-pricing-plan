[project]
name = "gi-backend"
version = "0.1.0"
description = "Orchestration, persistence and the HTTP API (07 — Platform)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "model-schema",
    "pricing-core",
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
]

# A member's dependency on another member needs its own source mapping — the root's does
# not cover it. See .claude/skills/python-package.
[tool.uv.sources]
model-schema = { workspace = true }
pricing-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
