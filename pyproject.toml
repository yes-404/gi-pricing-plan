[project]
name = "gi-pricing-plan"
version = "0.1.0"
description = "Open source general insurance pricing platform"
requires-python = ">=3.12"
license = "Apache-2.0"

# The root is a workspace container, not a distributable package. Without this uv tries to
# build it, finds no [build-system], and `uv sync` fails before any check runs.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "backend"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.1",
    # FastAPI's TestClient is an httpx transport; without httpx it imports but cannot run.
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    # Integration tests run against the real Postgres in deploy/docker-compose.yml.
    "psycopg[binary]>=3.2",
    # boto3 ships no py.typed marker. Stubs rather than a blanket mypy override: the S3
    # call signatures are precisely what --strict should be checking in this module.
    "boto3-stubs[s3]>=1.35",
    # Same reasoning for Celery: the task decorators are untyped without these, and
    # --strict then treats every task function as untyped.
    "celery-types>=0.22",
    # SciPy's own stubs. Without them `from scipy import stats` is an untyped import and
    # --strict rejects every call into it.
    "scipy-stubs>=1.14",
]

# ---- Ruff: CLAUDE.md §3, line length 100 ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/model-schema/src", "packages/pricing-core/src", "backend/src"]
# Vendored third-party skills are kept exactly as upstream wrote them. Linting someone
# else's code to our rules produces churn and breaks the promise that it is unmodified.
# Named individually, not the whole `.claude/skills` tree: a first-party skill's own
# scripts (e.g. `reporter-cycle`) belong under the same directory and must lint normally.
# Ruled 2026-08-29 (task #28): failing loud (ruff flags an unlisted vendored dir) is safer
# than failing silent (a new first-party skill quietly never lints), so a newly vendored
# skill must be added here explicitly rather than the reverse — add its path when vendored.
exclude = [
    ".claude/skills/brainstorming",
    ".claude/skills/code-quality",
    ".claude/skills/create-adaptable-composable",
    ".claude/skills/dispatching-parallel-agents",
    ".claude/skills/executing-plans",
    ".claude/skills/finishing-a-development-branch",
    ".claude/skills/graphify",
    ".claude/skills/planning-with-files",
    ".claude/skills/receiving-code-review",
    ".claude/skills/reproducing-ci-locally",
    ".claude/skills/requesting-code-review",
    ".claude/skills/secret-hygiene",
    ".claude/skills/security-audit",
    ".claude/skills/subagent-driven-development",
    ".claude/skills/systematic-debugging",
    ".claude/skills/test-driven-development",
    ".claude/skills/testing-strategy",
    ".claude/skills/ui-ux-pro-max",
    ".claude/skills/using-git-worktrees",
    ".claude/skills/using-superpowers",
    ".claude/skills/verification-before-completion",
    ".claude/skills/vue-best-practices",
    ".claude/skills/vue-debug-guides",
    ".claude/skills/vue-pinia-best-practices",
    ".claude/skills/vue-router-best-practices",
    ".claude/skills/vue-testing-best-practices",
    ".claude/skills/writing-plans",
    ".claude/skills/writing-skills",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "ANN", "PT"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ANN"]
# N818 wants an Error suffix on exception names. `JobCancelled` is deliberate: the spec
# names it (07 §5.2), and cancellation is a control-flow signal rather than a failure.
# Renaming would put the code and the specification out of step to satisfy a convention.
"packages/pricing-core/src/pricing_core/progress.py" = ["N818"]
# Alembic writes the bodies of migration files. Reformatting generated output to satisfy a
# line-length rule makes every future autogenerate produce a diff against our hand-edits.
# The hand-written sections are held to the rest of the rules.
"backend/migrations/versions/*.py" = ["E501"]

# ---- mypy --strict on packages/ (CLAUDE.md §3) ----
#
# `files` covers everything that combines into ONE invocation without a module-name
# collision: the three src trees, the repo-level `tests/` root, the demo seed
# (`examples/fremtpl2`), and the two live operational skill scripts. It deliberately does
# NOT include `packages/*/tests` or `backend/tests` — each package's own test directory has
# no `__init__.py` (by design, matching pytest's `--import-mode=importlib`: two packages
# each own a `conftest.py`/`test_money.py`), and mypy's module model has no equivalent of
# importlib mode. Combining two such directories in one invocation is not a size problem,
# it is a hard failure: `Duplicate module named "conftest"`. Checking those three directories
# needs one scoped invocation each — see `.claude/skills/dev-commands` for the commands and
# the current per-directory debt (`backend/tests` alone is >1000 errors; not attempted here).
#
# `explicit_package_bases` is required the moment any of the above namespace-style
# directories (no `__init__.py`) enters `files` at all. It is not optional once one is
# present: without it, mypy's fallback namespace-package inference is what produces the
# duplicate-module collision above, even for a single non-colliding directory.
#
# `mypy_path` is required BY `explicit_package_bases`, and for all four bases named — this
# was found the hard way: passing `backend/src` alone, with the flag on but `backend/src`
# itself absent from `mypy_path`, made mypy unable to resolve backend's OWN internal imports
# (`app.errors` etc., 536 bogus `import-untyped` errors) — it looked exactly like a real
# defect in `backend/src` until `mypy_path` was set correctly and the count went to zero.
[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
mypy_path = [
    "packages/model-schema/src",
    "packages/pricing-core/src",
    "backend/src",
    "examples/fremtpl2",
]
files = [
    "packages/model-schema/src",
    "packages/pricing-core/src",
    "backend/src",
    "tests",
    "examples/fremtpl2",
    ".claude/skills/balance-watch/scripts",
    ".claude/skills/reporter-cycle/scripts",
    ".claude/skills/watcher-runtime-state/scripts",
]
warn_unreachable = true
disallow_any_explicit = false

# scikit-learn ships no `py.typed` marker, so a --strict run cannot see through
# `sklearn.tree` and reports the import itself as an error (FR-103's two call sites,
# `tree` banding and `tree` grouping). The alternative — a per-line `type: ignore` at each
# import — states the same fact twice and goes stale silently when the package starts
# shipping types. Both call sites read `tree_.threshold` and `tree_.feature`, which are
# untyped attributes of an untyped object either way.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

# interpret-core 0.7.8 ships no `py.typed` marker either, and `fit_ebm` imports it at
# call-site scope (FR-140) — the same shape as the sklearn pair, for the same
# reason: the fit reads `term_scores_`/`bins_`/`best_iteration_` off an untyped object.
[[tool.mypy.overrides]]
module = ["interpret.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "packages/model-schema/tests",
    "packages/pricing-core/tests",
    "backend/tests",
    # Repository-level invariants no single component owns — the architecture contracts,
    # the compose stack, the cross-cutting checks. `scripts/req-coverage.py` and
    # `scripts/scope-audit.py` read this list, so adding a root here is all that is needed
    # for its markers to count as evidence.
    "tests",
    # The demo seed. Its 36 MB of data is fetched rather than committed, so CI cannot run
    # it end to end — but everything that decides whether it still works is pure: the ARFF
    # reader, the recipe order, and the rule set's conformance to FR-45.
    "examples/fremtpl2",
    # A regression test nothing runs is not a regression test. This is the fourth time
    # this exact defect has bitten (see the sibling comments above and
    # .github/workflows/python.yml's `paths:` filter, which each record one prior
    # occurrence — scope-audit.py, the seed under examples/**, and tests/** for
    # FR-417): a script or its tests lived somewhere `uv run pytest -q` and CI's path
    # filter both skip, and the gap was noticed only after something went unchecked.
    # `.claude/skills/reporter-cycle/scripts/` is stdlib-only and outside the uv
    # workspace, but `pyproject.toml` itself IS in python.yml's filter, so listing its
    # tests root here is what makes them run in CI on any PR that touches this file.
    ".claude/skills/reporter-cycle/scripts/tests",
]
# Each package owns a test module of the same name (test_money.py in both). The legacy
# prepend import mode collides on the basename; importlib keeps them distinct without
# forcing artificial file names or __init__.py files into test directories.
# --strict-markers: an unregistered marker is an error, so a typo'd @pytest.mark.req
# fails loudly instead of silently doing nothing — which matters when those marks are the
# requirement-traceability record (scripts/req-coverage.py).
addopts = "--import-mode=importlib --strict-markers"
asyncio_mode = "auto"
markers = [
    # Requirement traceability: mark each test with the requirement it satisfies.
    # skills-map §9.1 "spec-to-implementation conformance".
    "req: the requirement ID this test satisfies, e.g. @pytest.mark.req('FR-10')",
]
