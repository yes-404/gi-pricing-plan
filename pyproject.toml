[project]
name = "gi-pricing-plan"
version = "0.1.0"
description = "Open source general insurance pricing platform"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
model-schema = { workspace = true }
pricing-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.1",
]

# ---- Ruff: CLAUDE.md §3, line length 100 ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/model-schema/src", "packages/pricing-core/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "ANN", "PT"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ANN"]

# ---- mypy --strict on packages/ (CLAUDE.md §3) ----
[tool.mypy]
strict = true
python_version = "3.12"
files = ["packages/model-schema/src", "packages/pricing-core/src"]
warn_unreachable = true
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["packages/model-schema/tests", "packages/pricing-core/tests"]
# Each package owns a test module of the same name (test_money.py in both). The legacy
# prepend import mode collides on the basename; importlib keeps them distinct without
# forcing artificial file names or __init__.py files into test directories.
addopts = "--import-mode=importlib"
markers = [
    # Requirement traceability: mark each test with the requirement it satisfies.
    # skills-map §9.1 "spec-to-implementation conformance".
    "req: the requirement ID this test satisfies, e.g. @pytest.mark.req('FR-OVR-7')",
]
