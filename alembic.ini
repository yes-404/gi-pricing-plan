# Alembic configuration. Migrations are backend-owned but the command is run from the repo
# root (CLAUDE.md §11: `uv run alembic upgrade head`), so the ini lives here and points at
# the backend's script directory.
#
# The database URL is deliberately absent: env.py reads it from Settings, so a migration
# cannot be run against a database the application itself is not configured to talk to,
# and no connection string is committed (R3).
[alembic]
script_location = backend/migrations
prepend_sys_path = backend/src
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
